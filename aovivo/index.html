<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ao Vivo — Natureza Filosófica</title>
    <meta name="robots" content="noindex, nofollow">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #080808;
            color: #F5F1E8;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100svh;
            text-align: center;
            padding: 24px;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 400px;
        }

        .logo-yt {
            width: 72px;
            height: 72px;
            background: #FF0000;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-yt svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            font-family: 'Arial', sans-serif;
            font-weight: 700;
            font-size: 22px;
            line-height: 1.3;
        }

        p {
            font-size: 15px;
            color: rgba(245, 241, 232, 0.6);
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background: #FF0000;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            margin-top: 8px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #FF0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="logo-yt">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
        </div>

        <div class="spinner" id="spinner"></div>

        <h1>Abrindo a live no YouTube…</h1>
        <p>Você será redirecionado em instantes.<br>Se não abrir automaticamente, clique abaixo.</p>

        <a class="btn" href="https://youtube.com/live/bGfvXIOiUv4?feature=share" id="btn-fallback">
            Abrir no YouTube
        </a>
    </div>

    <script>
        var videoId = 'bGfvXIOiUv4';
        var youtubeUrl = 'https://youtube.com/live/' + videoId + '?feature=share';

        var ua = navigator.userAgent || '';
        var isAndroid = /android/i.test(ua);
        var isIOS = /iphone|ipad|ipod/i.test(ua);

        if (isAndroid) {
            // Android: intent URL abre direto no app do YouTube
            var intentUrl = 'intent://www.youtube.com/live/' + videoId +
                            '?feature=share#Intent;package=com.google.android.youtube;scheme=https;end';
            window.location.href = intentUrl;
            // Fallback após 1.5s se o app não abrir
            setTimeout(function() {
                window.location.href = youtubeUrl;
            }, 1500);
        } else if (isIOS) {
            // iOS: scheme nativo do YouTube
            var iosUrl = 'youtube://www.youtube.com/live/' + videoId;
            window.location.href = iosUrl;
            // Fallback para o browser se o app não estiver instalado
            setTimeout(function() {
                window.location.href = youtubeUrl;
            }, 1500);
        } else {
            // Desktop: redireciona direto
            setTimeout(function() {
                window.location.href = youtubeUrl;
            }, 800);
        }
    </script>
</body>
</html>
